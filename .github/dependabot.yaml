# Set update schedules for repository dependencies
version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    github-actions:
      patterns:
        - "*"
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    gomod:
      patterns:
        - "*"
- package-ecosystem: "uv"
  directory: "/"
  schedule:
    interval: "monthly"
  exclude-paths:
    # Sample applications should have their own update configuration.
    - "code-samples/**"
  groups:
    docs-python:
      patterns:
        - "*"
