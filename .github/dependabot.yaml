# Set update schedule for GitHub Actions
version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    github-actions:
      patterns:
        - "*"
- package-ecosystem: "gomod"
  directory: "/"
  schedule:
    interval: "monthly"
  groups:
    gomod:
      patterns:
        - "*"
