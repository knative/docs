name: samples-test
on:
  pull_request:
    paths: ['code-samples/**', '.github/workflows/samples-test.yaml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      directories: ${{ steps.samples.outputs.directories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: samples
        name: Find changed sample directories
        run: |
          python3 code-samples/ci/test_discover.py
          matrix=$(bash code-samples/ci/discover.sh "$BASE_SHA")
          echo 'Directories without a ci.sh ancestor are NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
          echo "$matrix" | jq -r '.[] | "- " + .name' >> "$GITHUB_STEP_SUMMARY"
          echo "directories=$matrix" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  test:
    name: ${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.directories != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.directories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Knative Functions CLI for function samples
        working-directory: ${{ matrix.directory }}
        run: |
          if [[ ! -f func.yaml ]]; then exit 0; fi
          # Match the real sample builder rather than substituting a test runtime.
          binary="$RUNNER_TEMP/func"
          curl -fsSL https://github.com/knative/func/releases/download/knative-v1.24.0/func_linux_amd64 -o "$binary"
          echo "33d8dbfbbb9a67ffb6f9296d142132faa2ab20af89b314ca1a2cf986b543b1d2  $binary" | sha256sum --check
          chmod +x "$binary"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: chainguard-dev/actions/setup-kind@794a2c44abbbd7b3a186db97b359270e4105448f
        with:
          k8s-version: 1.36.x
      - name: Install latest Knative Serving YAMLs
        run: |
          kubectl apply -f https://github.com/knative/serving/releases/latest/download/serving-crds.yaml
          kubectl apply -f https://github.com/knative/serving/releases/latest/download/serving-core.yaml
          kubectl apply -f https://github.com/knative-extensions/net-kourier/releases/latest/download/kourier.yaml
          kubectl patch cm config-network -n knative-serving --type merge -p '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl patch cm config-domain -n knative-serving --type merge -p '{"data":{"example.test":""}}'
          kubectl wait deployment --all -n knative-serving --for=condition=Available --timeout=300s
          kubectl wait deployment --all -n kourier-system --for=condition=Available --timeout=300s
      - name: Test
        working-directory: ${{ matrix.directory }}
        run: |
          kubectl -n kourier-system port-forward service/kourier 18080:80 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          for _attempt in {1..30}; do
            (true > /dev/tcp/127.0.0.1/18080) 2>/dev/null && break
            sleep 1
          done
          (true > /dev/tcp/127.0.0.1/18080) 2>/dev/null
          source ./ci.sh
          main
      - name: Failure diagnostics
        if: failure()
        run: |
          kubectl get ksvc,revisions,pods -A -o wide || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp || true
          kubectl -n default logs --all-containers -l serving.knative.dev/service --tail=100 || true
          kubectl -n default logs --all-containers -l app=node-server --tail=100 || true
          kubectl -n default logs --all-containers -l app=bookstore-frontend --tail=100 || true
          kubectl -n default logs --all-containers -l app=heartbeat-source --tail=100 || true
          kubectl -n default logs postgresql --tail=100 || true
          kubectl -n default logs ci-github-api --tail=100 || true
          kubectl -n default logs grpc-client --tail=100 || true
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster
