[package]
name = "knative-cloudevents-example"
version = "0.1.0"
authors = ["Francesco Guardiani <francescoguard@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cloudevents-sdk = { version = "0.9.0", features = ["actix", "reqwest"] }
# Match the Reqwest version used by the CloudEvents SDK's HTTP binding.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
actix-web = "4.17.0"
log = "0.4.34"
env_logger = "0.11.11"
