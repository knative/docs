apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: secrets-go
  namespace: default
spec:
  template:
    spec:
      containers:
      # Replace {username} with your container registry username.
      - image: docker.io/{username}/secrets-go
        # SECRET_FILE defaults to /var/secret/message. If you change the mount
        # path or projected filename, set SECRET_FILE to the matching file path.
        volumeMounts:
        - name: demo-secret
          mountPath: /var/secret
          readOnly: true
      volumes:
      - name: demo-secret
        secret:
          secretName: mounted-secret
