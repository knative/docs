<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Knative components</title>
  <desc id="description">Functions connects to a container and a trigger definition. The trigger connects to Eventing. Slack, Kubernetes, row changes, and S3 upload feed Eventing. Eventing connects to Events. The container and Events point to Serving. A User points to Serving. Solid and dashed connections, including connections without arrowheads, retain the relationships in the original illustration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#647b95" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #344054; font-size: 26px; }
      .connector { fill: none; stroke: #647b95; stroke-width: 2; stroke-linejoin: round; }
      .flow { marker-end: url(#arrow); }
      .definition { stroke-dasharray: 10 8; }
      .resource { fill: #f6f8fa; stroke: #7d91aa; stroke-width: 2; }
      .component { fill: #eaf3fc; stroke: #1261bd; stroke-width: 2; }
      .label, .label text { text-anchor: middle; dominant-baseline: central; font-weight: 500; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; }
      .note { font-size: 20px; }
      .note-key { font-weight: 600; }
    </style>
  </defs>
  <path fill="#fff" d="M0 0h1280v720H0z"/>

  <!-- The original unheaded vertical connections are intentionally not arrows. -->
  <path class="connector" d="M135 196v134"/>
  <path class="connector" d="M870 196v134"/>
  <path class="connector definition" d="M230 148h110"/>
  <path class="connector definition flow" d="M610 148h162"/>
  <path class="connector flow" d="M230 375h102"/>
  <path class="connector flow" d="M780 375H618"/>
  <path class="connector flow" d="M475 550V428"/>

  <!-- Each source retains its inbound arrow to Eventing. -->
  <path class="connector flow" d="M1060 90h-60l-32 26"/>
  <path class="connector flow" d="M1060 170h-60l-32-34"/>
  <path class="connector flow" d="M1060 250h-60l-32-94"/>
  <path class="connector flow" d="M1060 330h-60l-32-154"/>

  <rect class="component" x="40" y="100" width="190" height="96" rx="6"/>
  <text class="label" x="135" y="128">Functions</text>
  <text class="label code" x="135" y="164">$ kn func</text>

  <rect class="resource" x="340" y="80" width="270" height="130" rx="6"/>
  <text class="label" x="475" y="107">Trigger</text>
  <text class="code" x="358" y="138">on:</text>
  <text class="code" x="374" y="163">type: row-update</text>
  <text class="code" x="374" y="188">table: orders</text>

  <rect class="component" x="780" y="100" width="180" height="96" rx="6"/>
  <text class="label" x="870" y="148">Eventing</text>
  <rect class="resource" x="40" y="330" width="190" height="90" rx="6"/>
  <text class="label" x="135" y="375">Container</text>
  <rect class="component" x="340" y="330" width="270" height="90" rx="6"/>
  <text class="label" x="475" y="375">Serving</text>
  <rect class="resource" x="780" y="330" width="180" height="90" rx="6"/>
  <text class="label" x="870" y="375">Events</text>
  <rect class="resource" x="340" y="550" width="270" height="70" rx="6"/>
  <text class="label" x="475" y="585">User</text>

  <g class="resource">
    <rect x="1060" y="60" width="180" height="60" rx="6"/>
    <rect x="1060" y="140" width="180" height="60" rx="6"/>
    <rect x="1060" y="220" width="180" height="60" rx="6"/>
    <rect x="1060" y="300" width="180" height="60" rx="6"/>
  </g>
  <g class="label">
    <text x="1150" y="90">Slack</text>
    <text x="1150" y="170">Kubernetes</text>
    <text x="1150" y="250">Row changes</text>
    <text x="1150" y="330">S3 upload</text>
  </g>

  <text x="690" y="515" font-weight="600">Notes</text>
  <text class="note" x="690" y="555"><tspan class="note-key">Functions:</tspan> build, configure, and deploy</text>
  <text class="note" x="690" y="599"><tspan class="note-key">Serving:</tspan> run your application</text>
  <text class="note" x="690" y="643"><tspan class="note-key">Eventing:</tspan> trigger your application</text>
</svg>
