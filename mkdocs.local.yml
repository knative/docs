# Single-working-copy preview. Production uses mkdocs.yml.
INHERIT: mkdocs.yml

site_url: http://127.0.0.1:8000/
# Validate this checkout without imposing new checks on archived release branches.
validation:
  nav:
    omitted_files: warn
  links:
    unrecognized_links: warn
    anchors: warn
hooks:
  - hack/versioning.py
  - hack/local_preview.py
watch:
  - docs
  - overrides
  - mkdocs.yml
  - mkdocs.local.yml
  - config/versions.txt
