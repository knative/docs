# Fast, single-checkout preview. Production builds still use mkdocs.yml.
INHERIT: mkdocs.yml

site_url: http://127.0.0.1:8000/
# Retain shared exemptions and pages reached by links rather than lesson navigation.
# Keep this local: published releases still include the chooser in their nav.
not_in_nav: |
  /index.md
  /about-analytics-cookies.md
  /blog/articles/set-up-a-local-knative-environment-with-kind.md
  **/bookstore/create-slack-workspace/README.md
  /versioned/samples/README.md
# Validate this checkout without imposing new checks on archived release branches.
validation:
  nav:
    omitted_files: warn
  links:
    unrecognized_links: warn
    anchors: warn
hooks:
  - hack/versioning.py
  - hack/snippets.py
  - hack/local_preview.py
watch:
  - docs
  - overrides
  - hack/macros.py
