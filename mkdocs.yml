INHERIT: config/redirects.yml

site_name: Knative
site_url: https://knative.dev/
site_description: Knative Documentation
hooks:
  - hack/versioning.py
extra_javascript:
  - js/version-selector.js
extra_css:
  - stylesheets/extra.css
# Don't try to make snippets into regular docs (e.g. link-checking, nav, etc)
exclude_docs: |
  *docs/snippets/

# Root-relative links refer to published URLs (including redirects), not source
# Markdown paths. Keep them unchanged without reporting this valid URL style.
# This does not validate their destinations; check those in the rendered site.
validation:
  links:
    absolute_links: ignore

# These pages remain published but intentionally stay out of the main navigation:
# the homepage, footer legal page, superseded article, and linked tutorial helper.
not_in_nav: |
  /index.md
  /about-analytics-cookies.md
  /blog/articles/set-up-a-local-knative-environment-with-kind.md
  **/bookstore/create-slack-workspace/README.md

# The single-checkout preview enables stricter validation in mkdocs.local.yml.
# Older published release snapshots retain the default validation levels.

repo_url: https://github.com/knative/docs
edit_uri: edit/main/docs

theme:
  name: material
  logo: images/logo/rgb/knative-logo-rgb.png
  favicon: images/favicon.ico
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.action.edit

markdown_extensions:
  # - mdx_include:
  #     base_path: docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - meta
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs/snippets
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.escapeall
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - toc:
      permalink: true
  - def_list

plugins:
  search:
    # Spaces, dashes, periods and forward-slash (so serving.knative.dev/blibble can be searched as blibble).
    separator: '[\/\s\-\.]+'
  exclude:
    glob:
      # Exclude files that are built into other parts of the documentation
      - snippets/*
      - smoketest.md
  # This plugin enables .nav.yaml files for subtree navigation
  # (as well as automatic generation of index pages, which we should consider).
  awesome-nav:
    enabled: true
  rss:
    match_path: "blog/(articles|steering|events|releases)/.*"
    feeds_filenames:
      rss_created: "blog/feed_rss_created.xml"
      rss_updated: "blog/feed_rss_updated.xml"
    date_from_meta:
      as_creation: "date"
      datetime_format: "%Y-%m-%d"
  # Allow `.meta.yml` to define metadata for all pages below that directory.
  # See https://squidfunk.github.io/mkdocs-material/plugins/meta/
  meta:
    enabled: true
  macros:
    module_name: hack/macros
    include_dir: docs/snippets

copyright: "Copyright © 2025 The Knative Authors"

extra:
  # social:
    # - icon: fontawesome/brands/twitter
    #   link: https://twitter.com/KnativeProject
    # - icon: fontawesome/brands/github
    #   link: https://github.com/knative/community
    #   name: Knative Community on Github
    # - icon: fontawesome/brands/slack
    #   link: https://slack.cncf.io
    #   name: Slack
  analytics:
    provider: google
    property: G-YRMNFYE32R
  announcement:
    text: "Join us at KubeCon + CloudNativeCon North America on Nov 9-12 🎉"
    href: "https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/register/?utm_source=knative&utm_medium=ribbon-banner&utm_campaign=KubeCon-CloudNativeCon-NA-2026&utm_content=hero"
    link_text: "Register Today!"
